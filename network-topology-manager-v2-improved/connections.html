<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Связи — Network Topology Manager</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { max-width: 1000px; }
    #auto-link-bar {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #btn-auto-link {
      padding: 5px 14px;
      font-size: 0.95rem;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #btn-auto-link:hover { background: #0055aa; }
    #btn-auto-link:disabled { background: #aaa; cursor: not-allowed; }
    #auto-link-status { font-size: 0.9rem; color: #333; }
  </style>
</head>
<body>
  <nav>
    <a href="models.html">Модели</a>
    <a href="nodes.html">Ноды</a>
    <a href="connections.html" class="active">Связи</a>
    <a href="topology.html">Топология</a>
    <a href="settings.html">Настройки</a>
    <a href="guide.html">Инструкция</a>
  </nav>

  <h1>Реестр связей между нодами</h1>

  <div id="auto-link-bar">
    <button id="btn-auto-link">Автосвязи</button>
    <span id="auto-link-status"></span>
  </div>

  <div id="error-msg"></div>

  <table id="connections-table">
    <thead>
      <tr>
        <th>Источник</th>
        <th>Порт ист.</th>
        <th>Назначение</th>
        <th>Порт назн.</th>
        <th>Тип линии</th>
        <th>Цвет линии</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="connections-tbody"></tbody>
  </table>

  <script type="module">
    import { initConnectionsPage } from './js/connections.js';

    const tbody = document.getElementById('connections-tbody');
    const errorMsg = document.getElementById('error-msg');
    const btnAutoLink = document.getElementById('btn-auto-link');
    const autoLinkStatus = document.getElementById('auto-link-status');

    initConnectionsPage(tbody, errorMsg, btnAutoLink, autoLinkStatus);
  </script>
</body>
</html>
